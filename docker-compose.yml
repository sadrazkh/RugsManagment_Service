services:
  postgres:
    image: postgres:16-alpine
    container_name: rugs_postgres
    environment:
      POSTGRES_USER: postgres
      # باید با Password در ConnectionStrings:DefaultConnection فایل
      # src/RugsManagment.Web/appsettings.json یکی بماند؛ اگر یکی را عوض کردید دیگری را هم عوض کنید
      # (این رمز فقط برای توسعهٔ محلی است — در تولید رشتهٔ اتصال از متغیر محیطی می‌آید).
      POSTGRES_PASSWORD: "7082"
      POSTGRES_DB: rugs_management
    ports:
      - "5432:5432"
    volumes:
      - rugs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rugs_pg_data:
