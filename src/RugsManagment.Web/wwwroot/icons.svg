<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    اسپرایت آیکون‌های سامانه (سبک Lucide، stroke-based).
    استفاده در Razor:  <svg class="h-5 w-5"><use href="/icons.svg#dashboard"></use></svg>
    استفاده در Vue:    <AppIcon name="dashboard" />
